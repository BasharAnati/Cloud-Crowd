<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <title>Cloud Crowd - CCTV Operations Center</title>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/design-tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="assets/css/theme-base.css">
  <link rel="stylesheet" href="media-viewer.css">

  <script>
    const MAINTENANCE_ADMIN = "Anati";
    const MAINTENANCE_ENDPOINT = "/.netlify/functions/maintenance";

    function isMaintenanceAdmin() {
      return sessionStorage.getItem("cc_auth") === "1" &&
        sessionStorage.getItem("cc_role") === "admin" &&
        sessionStorage.getItem("cc_user") === MAINTENANCE_ADMIN;
    }

    async function fetchMaintenanceStatus() {
      try {
        const response = await fetch(MAINTENANCE_ENDPOINT, {
          cache: "no-store",
          headers: {
            'Authorization': `Bearer ${sessionStorage.getItem('cc_token') || ''}`
          }
        });
        if (!response.ok) throw new Error(`Maintenance check failed: ${response.status}`);
        const data = await response.json();
        return {
          maintenance: data.maintenance === true,
          admin: data.admin === true
        };
      } catch (err) {
        console.warn("Maintenance check failed.", err);
        return null;
      }
    }

    async function enforceMaintenanceMode() {
      const status = await fetchMaintenanceStatus();
      if (status?.maintenance === true && status.admin !== true) {
        window.location.href = "system-update.html";
      }
    }

    enforceMaintenanceMode();
    setInterval(enforceMaintenanceMode, 3000);
  </script>
  <script>
    window.currentSection = 'cctv';
  </script>

  <script>
    if (sessionStorage.getItem('cc_auth') !== '1' || !sessionStorage.getItem('cc_token') || !sessionStorage.getItem('cc_role')) {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }
  </script>

  <script src="js/permissions.js"></script>
  <script>
    window.CCPermissions?.requirePageAccess('cctv');
  </script>
  <script src="js/app-shell.js" defer></script>
  <script src="shared/ticket-domain-config.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/tickets-render.js" defer></script>
  <script src="js/media-viewer.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body class="cctv-page cctv-ops-center">
  <div class="cctv-module-shell cc-shell-layout">
    <aside id="cctv-app-sidebar" aria-label="CCTV Operations Center navigation"></aside>

    <main class="cctv-workspace cctv-main-area" id="main-content">
      <header id="cctv-app-topbar" role="banner"></header>

      <section class="cctv-hero" aria-labelledby="cctv-page-title">
        <div class="cctv-hero-copy">
          <h2 id="cctv-page-title">CCTV Operations Center</h2>
          <p>Monitor escalations, active reviews, policy observations, and closure progress across camera zones.</p>
        </div>
        <div class="cctv-actions">
          <button class="add-ticket-btn" type="button" onclick="openModal('cctv')" data-permission-create>Add New Ticket</button>
        </div>
      </section>

      <section class="cctv-stats" aria-label="CCTV case summary">
        <article class="cctv-stat-card cctv-stat-total">
          <span class="cctv-stat-icon" aria-hidden="true"></span>
          <span class="cctv-stat-label">Total Cases</span>
          <strong id="cctv-stat-total">0</strong>
        </article>
        <article class="cctv-stat-card cctv-stat-escalated">
          <span class="cctv-stat-icon" aria-hidden="true"></span>
          <span class="cctv-stat-label">Escalated</span>
          <strong id="cctv-stat-escalated">0</strong>
        </article>
        <article class="cctv-stat-card cctv-stat-review">
          <span class="cctv-stat-icon" aria-hidden="true"></span>
          <span class="cctv-stat-label">Under Review</span>
          <strong id="cctv-stat-under-review">0</strong>
        </article>
        <article class="cctv-stat-card cctv-stat-closed">
          <span class="cctv-stat-icon" aria-hidden="true"></span>
          <span class="cctv-stat-label">Closed</span>
          <strong id="cctv-stat-closed">0</strong>
        </article>
      </section>

      <section class="cctv-filters" aria-label="CCTV filters">
        <div class="cctv-filter-field cctv-filter-search">
          <label for="cctv-search">Search</label>
          <input id="cctv-search" type="search" placeholder="Case, branch, staff, camera, section, or notes">
        </div>
        <div class="cctv-filter-field">
          <label for="cctv-status-filter">Status</label>
          <select id="cctv-status-filter">
            <option value="">All statuses</option>
          </select>
        </div>
        <div class="cctv-filter-field">
          <label for="cctv-branch-filter">Branch</label>
          <select id="cctv-branch-filter">
            <option value="">All branches</option>
          </select>
        </div>
        <div class="cctv-filter-field">
          <label for="cctv-review-filter">Review Type</label>
          <select id="cctv-review-filter">
            <option value="">All review types</option>
          </select>
        </div>
        <div class="cctv-filter-field">
          <label for="cctv-policy-filter">Violated Policy</label>
          <select id="cctv-policy-filter">
            <option value="">All policies</option>
          </select>
        </div>
        <div class="cctv-filter-field">
          <label for="cctv-staff-filter">Staff</label>
          <select id="cctv-staff-filter">
            <option value="">All staff</option>
          </select>
        </div>
      </section>

      <div class="ticket-list cctv-board" id="ticket-list">
        <div id="tickets"></div>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>Add New Ticket</h2>
      <form id="ticket-form">
        <div id="dynamic-form"></div>
        <div class="form-actions">
          <button type="submit" class="submit-btn">Submit</button>
          <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="drawer" id="ticket-drawer" aria-hidden="true">
    <div class="drawer-backdrop" onclick="closeTicketDrawer()"></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-header">
        <div>
          <div class="drawer-case">Case: <span id="drawer-caseNumber"></span></div>
          <h2 id="drawer-title">Details</h2>
        </div>
        <button class="drawer-close" onclick="closeTicketDrawer()" aria-label="Close">x</button>
      </div>

      <div class="drawer-meta" id="drawer-meta"></div>
      <div class="drawer-body" id="drawer-body"></div>
      <div class="drawer-actions"><button class="edit-btn" id="drawer-edit-btn">Edit</button></div>
    </aside>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }

    window.addEventListener('load', () => {
      CloudCrowdAppShell.buildSidebar(
        document.getElementById("cctv-app-sidebar")
      );

      CloudCrowdAppShell.buildTopbar(
        document.getElementById("cctv-app-topbar"),
        {
          eyebrow: "Operations Hub",
          title: "CCTV Operations Center",
          userId: "cctv-current-user",
          roleId: "cctv-current-role",
          onLogout: logout
        }
      );

      currentSection = 'cctv';
      if (typeof renderTickets === 'function') renderTickets();
    });
  </script>
  <script src="idle-logout.js"></script>
</body>
</html>
