<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <title>Cloud Crowd - CCTV Operations Center</title>
  <script src="assets/js/theme.js"></script>
  <script src="assets/vendor/lucide/lucide-subset.js"></script>
  <script src="assets/js/components/buttons.js"></script>
  <script src="assets/js/components/icons.js"></script>
  <script src="assets/js/components/feedback.js"></script>
  <script src="assets/js/components/dialog.js"></script>
  <script src="assets/js/components/confirmation.js"></script>
  <script src="assets/js/components/status-registry.js"></script>
  <link rel="stylesheet" href="assets/css/design-tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="assets/css/theme-base.css">
  <link rel="stylesheet" href="media-viewer.css">

  <script src="js/maintenance.js"></script>
  <script>
    window.CC_MAINTENANCE_LIFECYCLE = window.CloudCrowdMaintenance.createLifecycle();
    window.CC_MAINTENANCE_LIFECYCLE.startEnforcement();
  </script>
  <script>
    window.currentSection = 'cctv';
  </script>

  <script>
    if (sessionStorage.getItem('cc_auth') !== '1' || !sessionStorage.getItem('cc_token') || !sessionStorage.getItem('cc_role')) {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }
  </script>

  <script src="js/permissions.js"></script>
  <script>
    window.CC_PROTECTED_PAGE_READY = (async () => {
      const access = await window.CCPermissions?.requirePageAccess('cctv', { force: true });
      if (!access || access.unavailable || access.canView !== true) return false;
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'main.js';
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
      return true;
    })();
  </script>
  <script src="js/app-shell.js" defer></script>
  <script src="shared/ticket-domain-config.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/tickets-render.js" defer></script>
  <script src="js/media-viewer.js" defer></script>
  <link rel="stylesheet" href="assets/css/layouts/page-layout.css">
  <link rel="stylesheet" href="assets/css/components/buttons.css">
  <link rel="stylesheet" href="assets/css/components/icons.css">
  <link rel="stylesheet" href="assets/css/components/feedback.css">
  <link rel="stylesheet" href="assets/css/components/forms.css">
  <link rel="stylesheet" href="assets/css/components/filters.css">
  <link rel="stylesheet" href="assets/css/components/cards.css">
  <link rel="stylesheet" href="assets/css/components/status.css">
  <link rel="stylesheet" href="assets/css/components/dialogs.css">
  <link rel="stylesheet" href="assets/css/components/drawers.css">
  <link rel="stylesheet" href="assets/css/components/kanban.css">
  <link rel="stylesheet" href="assets/css/pages/cctv-v2.css">
</head>
<body class="cctv-page cctv-ops-center cctv-v2">
  <div class="cctv-module-shell cc-shell-layout">
    <aside id="cctv-app-sidebar" aria-label="CCTV Operations Center navigation"></aside>

    <main class="cctv-workspace cctv-main-area cc-page-container cc-page-container--workspace" id="main-content">
      <header id="cctv-app-topbar" role="banner"></header>

      <header class="cctv-hero cc-page-header" aria-labelledby="cctv-page-title">
        <div class="cctv-hero-copy cc-page-header-content">
          <h1 class="cc-page-header-title" id="cctv-page-title">CCTV Operations Center</h1>
          <p class="cc-page-header-description">Monitor escalations, active reviews, policy observations, and closure progress across camera zones.</p>
        </div>
        <div class="cctv-actions cc-page-header-actions">
          <button class="add-ticket-btn" type="button" onclick="openModal('cctv')" data-permission-create>Add New Ticket</button>
        </div>
      </header>

      <section class="cctv-stats cc-metric-grid" aria-label="CCTV case summary">
        <article class="cctv-stat-card cc-metric-card cctv-stat-total">
          <span class="cctv-stat-icon" data-cc-icon="video" aria-hidden="true"></span>
          <span class="cctv-stat-label">Total Cases</span>
          <strong id="cctv-stat-total">0</strong>
        </article>
        <article class="cctv-stat-card cc-metric-card cctv-stat-escalated">
          <span class="cctv-stat-icon" data-cc-icon="triangle-alert" aria-hidden="true"></span>
          <span class="cctv-stat-label">Escalated</span>
          <strong id="cctv-stat-escalated">0</strong>
        </article>
        <article class="cctv-stat-card cc-metric-card cctv-stat-review">
          <span class="cctv-stat-icon" data-cc-icon="refresh-cw" aria-hidden="true"></span>
          <span class="cctv-stat-label">Under Review</span>
          <strong id="cctv-stat-under-review">0</strong>
        </article>
        <article class="cctv-stat-card cc-metric-card cctv-stat-closed">
          <span class="cctv-stat-icon" data-cc-icon="badge-check" aria-hidden="true"></span>
          <span class="cctv-stat-label">Closed</span>
          <strong id="cctv-stat-closed">0</strong>
        </article>
      </section>

      <section class="cctv-filters cc-filter-bar cc-filter-bar--dense-six" aria-label="CCTV filters">
        <div class="cctv-filter-field cctv-filter-search">
          <label for="cctv-search">Search</label>
          <input id="cctv-search" type="search" placeholder="Case, branch, staff, camera, section, or notes">
        </div>
        <div class="cctv-filter-field">
          <label for="cctv-status-filter">Status</label>
          <select id="cctv-status-filter">
            <option value="">All statuses</option>
          </select>
        </div>
        <div class="cctv-filter-field">
          <label for="cctv-branch-filter">Branch</label>
          <select id="cctv-branch-filter">
            <option value="">All branches</option>
          </select>
        </div>
        <div class="cctv-filter-field">
          <label for="cctv-review-filter">Review Type</label>
          <select id="cctv-review-filter">
            <option value="">All review types</option>
          </select>
        </div>
        <div class="cctv-filter-field">
          <label for="cctv-policy-filter">Violated Policy</label>
          <select id="cctv-policy-filter">
            <option value="">All policies</option>
          </select>
        </div>
        <div class="cctv-filter-field">
          <label for="cctv-staff-filter">Staff</label>
          <select id="cctv-staff-filter">
            <option value="">All staff</option>
          </select>
        </div>
      </section>

      <div class="ticket-list cctv-board" id="ticket-list">
        <div id="tickets"></div>
      </div>
    </main>
  </div>

  <div class="modal cc-dialog" id="modal" aria-hidden="true">
    <div class="modal-content cc-dialog__panel cc-dialog__panel--600" role="dialog" aria-modal="true" aria-labelledby="operations-modal-title" data-cc-overlay-panel>
      <div class="cc-dialog__header"><h2 class="cc-modal-title cc-dialog__title" id="operations-modal-title">Add New Ticket</h2><button class="drawer-close cc-dialog__close" type="button" aria-label="Close Add New Ticket form" onclick="closeModal()">&times;</button></div>
      <form id="ticket-form" class="cc-form">
        <div id="dynamic-form" class="cc-dialog__body"></div>
        <div class="form-actions cc-form-actions cc-dialog__footer">
          <button type="submit" class="submit-btn">Submit</button>
          <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="drawer cc-drawer cctv-ticket-modal" id="ticket-drawer" aria-hidden="true">
    <div class="drawer-backdrop cc-drawer__backdrop"></div>
    <section class="drawer-panel cc-drawer__panel cctv-ticket-modal__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title" data-cc-overlay-panel>
      <div class="drawer-header cc-drawer__header">
        <div>
          <div class="drawer-case">Ticket details</div>
          <h2 class="cc-modal-title" id="drawer-title"><span id="drawer-caseNumber"></span></h2>
        </div>
        <button class="drawer-close" type="button" onclick="closeTicketDrawer()" aria-label="Close">x</button>
      </div>

      <div class="drawer-meta" id="drawer-meta"></div>
      <div class="cctv-ticket-tabs" role="tablist" aria-label="Ticket information">
        <button id="drawer-details-tab" class="cctv-ticket-tab" type="button" role="tab" aria-selected="true" aria-controls="drawer-body">Details</button>
        <button id="drawer-history-tab" class="cctv-ticket-tab" type="button" role="tab" aria-selected="false" aria-controls="drawer-history" tabindex="-1">History</button>
      </div>
      <div class="drawer-body cc-drawer__body" id="drawer-body" role="tabpanel" aria-labelledby="drawer-details-tab"></div>
      <div class="drawer-body cc-drawer__body cctv-ticket-history" id="drawer-history" role="tabpanel" aria-labelledby="drawer-history-tab" hidden></div>
      <div class="drawer-actions cc-drawer__footer"><button class="edit-btn" id="drawer-edit-btn" type="button">Edit</button></div>
    </section>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }

    window.addEventListener('load', async () => {
      if (await window.CC_PROTECTED_PAGE_READY !== true) return;
      CloudCrowdAppShell.buildSidebar(
        document.getElementById("cctv-app-sidebar")
      );

      CloudCrowdAppShell.buildTopbar(
        document.getElementById("cctv-app-topbar"),
        {
          eyebrow: "Operations Hub",
          title: "CCTV Operations Center",
          userId: "cctv-current-user",
          roleId: "cctv-current-role",
          onLogout: logout
        }
      );

      currentSection = 'cctv';
      if (typeof renderTickets === 'function') renderTickets();
    });
  </script>
  <script src="idle-logout.js"></script>
</body>
</html>
