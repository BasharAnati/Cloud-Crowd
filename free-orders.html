<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <title>Cloud Crowd - Complimentary</title>
  <script src="assets/js/theme.js"></script>
  <script src="assets/vendor/lucide/lucide-subset.js"></script>
  <script src="assets/js/components/buttons.js"></script>
  <script src="assets/js/components/icons.js"></script>
  <script src="assets/js/components/feedback.js"></script>
  <script src="assets/js/components/dialog.js"></script>
  <script src="assets/js/components/confirmation.js"></script>
  <script src="assets/js/components/status-registry.js"></script>
  <link rel="stylesheet" href="assets/css/design-tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="assets/css/theme-base.css">
  <link rel="stylesheet" href="media-viewer.css">
  <script src="js/maintenance.js"></script>
  <script>
    window.CC_MAINTENANCE_LIFECYCLE = window.CloudCrowdMaintenance.createLifecycle();
    window.CC_MAINTENANCE_LIFECYCLE.startEnforcement();
  </script>
  <script>
    if (sessionStorage.getItem('cc_auth') !== '1' || !sessionStorage.getItem('cc_token') || !sessionStorage.getItem('cc_role')) {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }
  </script>
  <script src="js/permissions.js"></script>
  <script>
    window.CC_PROTECTED_PAGE_READY = (async () => {
      const access = await window.CCPermissions?.requirePageAccess('complimentary_orders', { force: true });
      if (!access || access.unavailable || access.canView !== true) return false;
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'main.js'; script.onload = resolve; script.onerror = reject;
        document.head.appendChild(script);
      });
      return true;
    })();
  </script>
  <script src="js/app-shell.js" defer></script>
  <script src="shared/ticket-domain-config.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/tickets-render.js" defer></script>
  <script src="js/media-viewer.js" defer></script>
  <link rel="stylesheet" href="assets/css/layouts/page-layout.css">
  <link rel="stylesheet" href="assets/css/components/buttons.css">
  <link rel="stylesheet" href="assets/css/components/icons.css">
  <link rel="stylesheet" href="assets/css/components/feedback.css">
  <link rel="stylesheet" href="assets/css/components/forms.css">
  <link rel="stylesheet" href="assets/css/components/filters.css">
  <link rel="stylesheet" href="assets/css/components/cards.css">
  <link rel="stylesheet" href="assets/css/components/status.css">
  <link rel="stylesheet" href="assets/css/components/dialogs.css">
  <link rel="stylesheet" href="assets/css/components/drawers.css">
  <link rel="stylesheet" href="assets/css/components/kanban.css">
  <link rel="stylesheet" href="assets/css/pages/internal-platform-v2.css">
  <link rel="stylesheet" href="assets/css/pages/free-orders-v2.css">
</head>
<body class="free-orders-page free-orders-ops-center free-orders-v2 platform-v2-page">
  <div class="free-orders-module-shell cc-shell-layout has-responsive-navigation" id="free-orders-shell">
    <aside id="free-orders-app-sidebar" aria-label="Complimentary Orders navigation"></aside>

    <main class="free-orders-workspace free-orders-main-area cc-page-container cc-page-container--workspace" id="main-content">
      <header id="free-orders-app-topbar" role="banner"></header>

      <header class="free-orders-hero cc-page-header platform-v2-hero" aria-labelledby="free-orders-page-title">
        <div class="free-orders-hero-copy cc-page-header-content">
          <h1 class="cc-page-header-title" id="free-orders-page-title">Complimentary Orders Operations Center</h1>
          <p class="cc-page-header-description">Track complimentary orders, approvals, usage status, and case resolution progress.</p>
        </div>
        <div class="free-orders-actions cc-page-header-actions">
          <button class="add-ticket-btn" type="button" onclick="openModal('free-orders')" data-permission-create>Add New Ticket</button>
        </div>
      </header>

    <section class="free-orders-stats cc-metric-grid" aria-label="Complimentary order stats">
      <article class="free-orders-stat-card cc-metric-card free-orders-stat-total">
        <span class="free-orders-stat-icon" data-cc-icon="shopping-bag" aria-hidden="true"></span>
        <span class="free-orders-stat-label">Total Orders</span>
        <strong id="free-orders-stat-total">0</strong>
      </article>
      <article class="free-orders-stat-card cc-metric-card free-orders-stat-new">
        <span class="free-orders-stat-icon" data-cc-icon="clipboard-list" aria-hidden="true"></span>
        <span class="free-orders-stat-label">New</span>
        <strong id="free-orders-stat-new">0</strong>
      </article>
      <article class="free-orders-stat-card cc-metric-card free-orders-stat-active">
        <span class="free-orders-stat-icon" data-cc-icon="refresh-cw" aria-hidden="true"></span>
        <span class="free-orders-stat-label">Active</span>
        <strong id="free-orders-stat-active">0</strong>
      </article>
      <article class="free-orders-stat-card cc-metric-card free-orders-stat-taken">
        <span class="free-orders-stat-icon" data-cc-icon="badge-check" aria-hidden="true"></span>
        <span class="free-orders-stat-label">Taken</span>
        <strong id="free-orders-stat-taken">0</strong>
      </article>
      <article class="free-orders-stat-card cc-metric-card free-orders-stat-discount">
        <span class="free-orders-stat-icon" data-cc-icon="receipt" aria-hidden="true"></span>
        <span class="free-orders-stat-label">Total Discount Value</span>
        <strong id="free-orders-stat-discount">0</strong>
      </article>
    </section>

    <section class="free-orders-filters cc-filter-bar cc-filter-bar--dense" aria-label="Complimentary order filters">
      <div class="free-orders-filter-field">
        <label for="free-orders-search">Search</label>
        <input id="free-orders-search" type="search" placeholder="Order, customer, phone, new order">
      </div>
      <div class="free-orders-filter-field">
        <label for="free-orders-status-filter">Status</label>
        <select id="free-orders-status-filter">
          <option value="">All statuses</option>
        </select>
      </div>
      <div class="free-orders-filter-field">
        <label for="free-orders-channel-filter">Channel</label>
        <select id="free-orders-channel-filter">
          <option value="">All channels</option>
        </select>
      </div>
      <div class="free-orders-filter-field">
        <label for="free-orders-decision-filter">Decision Maker</label>
        <select id="free-orders-decision-filter">
          <option value="">All decision makers</option>
        </select>
      </div>
      <div class="free-orders-filter-field">
        <label for="free-orders-new-order-filter">New Order Number</label>
        <select id="free-orders-new-order-filter">
          <option value="">All records</option>
          <option value="yes">Has new order number</option>
          <option value="no">Missing new order number</option>
        </select>
      </div>
    </section>

    <div class="ticket-list free-orders-board" id="ticket-list">
      <div id="tickets"></div>
    </div>
    </main>

    <button
      id="free-orders-nav-backdrop"
      class="free-orders-nav-backdrop cc-shell-nav-backdrop"
      type="button"
      aria-label="Close Complimentary Orders navigation"
    ></button>
  </div>

  <div class="modal cc-dialog" id="modal" aria-hidden="true">
    <div class="modal-content cc-dialog__panel cc-dialog__panel--600" role="dialog" aria-modal="true" aria-labelledby="operations-modal-title" data-cc-overlay-panel>
      <div class="cc-dialog__header"><span class="free-orders-modal-icon" data-cc-icon="receipt" aria-hidden="true"></span><h2 class="cc-modal-title cc-dialog__title" id="operations-modal-title">Add New Ticket</h2><button class="drawer-close cc-dialog__close" type="button" aria-label="Close Add New Ticket form" onclick="closeModal()">&times;</button></div>
      <form id="ticket-form" class="cc-form">
        <div id="dynamic-form" class="cc-dialog__body"></div>
        <div class="form-actions cc-form-actions cc-dialog__footer">
          <button type="submit" class="submit-btn">Submit</button>
          <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Details Drawer -->
  <div class="drawer cc-drawer" id="ticket-drawer" aria-hidden="true">
    <div class="drawer-backdrop cc-drawer__backdrop"></div>
    <aside class="drawer-panel cc-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title" data-cc-overlay-panel>
      <div class="drawer-header cc-drawer__header">
        <div>
          <div class="drawer-case">Order Number: <span id="drawer-caseNumber"></span></div>
          <h2 class="cc-modal-title" id="drawer-title">Details</h2>
        </div>
        <button class="drawer-close" type="button" onclick="closeTicketDrawer()" aria-label="Close">×</button>
      </div>
      <div class="drawer-meta" id="drawer-meta"></div>
      <div class="drawer-body cc-drawer__body" id="drawer-body"></div>
      <div class="drawer-actions cc-drawer__footer"><button class="edit-btn" id="drawer-edit-btn" type="button">Edit</button></div>
    </aside>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }

    function decorateComplimentaryOrderForm() {
      const icons = ['users', 'receipt', 'shield-check', 'calendar-check', 'file-text'];
      document.querySelectorAll('#dynamic-form > .cc-form-section > .cc-form-section__title').forEach((title, index) => {
        if (title.querySelector('[data-cc-section-icon]')) return;
        const icon = document.createElement('span');
        icon.dataset.ccIcon = icons[index] || 'file-text';
        icon.dataset.ccSectionIcon = '';
        icon.setAttribute('aria-hidden', 'true');
        title.prepend(icon);
      });
    }

    window.addEventListener('load', async () => {
      if (await window.CC_PROTECTED_PAGE_READY !== true) return;
      await CloudCrowdAppShell.initializeAppShell({
        shell: document.getElementById('free-orders-shell'),
        sidebar: document.getElementById('free-orders-app-sidebar'),
        topbar: document.getElementById('free-orders-app-topbar'),
        backdrop: document.getElementById('free-orders-nav-backdrop'),
        activeModule: CloudCrowdAppShell.getModuleById('complimentary-orders'),
        fallbackMode: 'legacy',
        brandImage: 'assets/images/logo.png',
        eyebrow: 'Operations Hub',
        title: 'Complimentary Orders',
        userId: 'free-orders-current-user',
        roleId: 'free-orders-current-role',
        onLogout: logout
      });
      document.querySelector('.free-orders-actions .add-ticket-btn')?.addEventListener('click', decorateComplimentaryOrderForm);
      currentSection = 'free-orders';
      renderTickets();
    });
  </script>
  <script src="idle-logout.js"></script>

</body>
</html>
