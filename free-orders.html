<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <title>Cloud Crowd - Complimentary</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="media-viewer.css">
  <script>
    const MAINTENANCE_ADMIN = "Anati";
    const MAINTENANCE_ENDPOINT = "/.netlify/functions/maintenance";

    function isMaintenanceAdmin() {
      return localStorage.getItem("cc_auth") === "1" &&
        localStorage.getItem("cc_role") === "admin" &&
        localStorage.getItem("cc_user") === MAINTENANCE_ADMIN;
    }

    async function fetchMaintenanceStatus() {
      try {
        const response = await fetch(MAINTENANCE_ENDPOINT, {
          cache: "no-store",
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('cc_token') || ''}`
          }
        });
        if (!response.ok) throw new Error(`Maintenance check failed: ${response.status}`);
        const data = await response.json();
        return {
          maintenance: data.maintenance === true,
          admin: data.admin === true
        };
      } catch (err) {
        console.warn("Maintenance check failed.", err);
        return null;
      }
    }

    async function enforceMaintenanceMode() {
      const status = await fetchMaintenanceStatus();
      if (status?.maintenance === true && status.admin !== true) {
        window.location.href = "system-update.html";
      }
    }

    enforceMaintenanceMode();
    setInterval(enforceMaintenanceMode, 3000);
  </script>
  <script>
    if (localStorage.getItem('cc_auth') !== '1' || !localStorage.getItem('cc_token') || !localStorage.getItem('cc_role')) {
      localStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }
  </script>
  <script src="js/permissions.js"></script>
  <script>
    window.CCPermissions?.requirePageAccess('complimentary_orders');
  </script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/tickets-render.js" defer></script>
  <script src="js/media-viewer.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body class="free-orders-page">
  <header class="navbar" role="banner">
    <div class="brand" aria-hidden="false">
      <div class="logo" title="Cloud Crowd" onclick="window.location.href='dashboard.html'" style="cursor:pointer;">CC</div>
      <div>
        <h1>Cloud Crowd</h1>
        <p>Complimentary</p>
      </div>
    </div>
    <img src="assets/images/logo.png" alt="Company Logo" class="nav-center-logo" onclick="window.location.href='dashboard.html'">
  </header>

  <div class="container free-orders-workspace" id="main-content">
    <section class="free-orders-hero" aria-labelledby="page-title">
      <div class="free-orders-hero-copy">
        <h2 id="page-title">Complimentary Orders</h2>
        <p>Track next-order compensation, customer discounts, and follow-up usage.</p>
      </div>
      <div class="buttons-container free-orders-actions">
        <button class="back-btn" onclick="goBack()">Back</button>
        <button class="add-ticket-btn" onclick="openModal('free-orders')">Add New Ticket</button>
      </div>
    </section>

    <section class="free-orders-stats" aria-label="Complimentary order stats">
      <div class="free-orders-stat-card">
        <span class="free-orders-stat-label">Total Orders</span>
        <strong id="free-orders-stat-total">0</strong>
      </div>
      <div class="free-orders-stat-card">
        <span class="free-orders-stat-label">New</span>
        <strong id="free-orders-stat-new">0</strong>
      </div>
      <div class="free-orders-stat-card">
        <span class="free-orders-stat-label">Active</span>
        <strong id="free-orders-stat-active">0</strong>
      </div>
      <div class="free-orders-stat-card">
        <span class="free-orders-stat-label">Taken</span>
        <strong id="free-orders-stat-taken">0</strong>
      </div>
      <div class="free-orders-stat-card">
        <span class="free-orders-stat-label">Total Discount Value</span>
        <strong id="free-orders-stat-discount">0</strong>
      </div>
    </section>

    <section class="free-orders-filters" aria-label="Complimentary order filters">
      <div class="free-orders-filter-field">
        <label for="free-orders-search">Search</label>
        <input id="free-orders-search" type="search" placeholder="Order, customer, phone, new order">
      </div>
      <div class="free-orders-filter-field">
        <label for="free-orders-status-filter">Status</label>
        <select id="free-orders-status-filter">
          <option value="">All statuses</option>
        </select>
      </div>
      <div class="free-orders-filter-field">
        <label for="free-orders-channel-filter">Channel</label>
        <select id="free-orders-channel-filter">
          <option value="">All channels</option>
        </select>
      </div>
      <div class="free-orders-filter-field">
        <label for="free-orders-decision-filter">Decision Maker</label>
        <select id="free-orders-decision-filter">
          <option value="">All decision makers</option>
        </select>
      </div>
      <div class="free-orders-filter-field">
        <label for="free-orders-new-order-filter">New Order Number</label>
        <select id="free-orders-new-order-filter">
          <option value="">All records</option>
          <option value="yes">Has new order number</option>
          <option value="no">Missing new order number</option>
        </select>
      </div>
    </section>

    <div class="ticket-list free-orders-board" id="ticket-list">
      <div id="tickets"></div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>Add New Ticket</h2>
      <form id="ticket-form">
        <div id="dynamic-form"></div>
        <div class="form-actions">
          <button type="submit" class="submit-btn">Submit</button>
          <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Details Drawer -->
  <div class="drawer" id="ticket-drawer" aria-hidden="true">
    <div class="drawer-backdrop" onclick="closeTicketDrawer()"></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-header">
        <div>
          <div class="drawer-case">Order Number: <span id="drawer-caseNumber"></span></div>
          <h2 id="drawer-title">Details</h2>
        </div>
        <button class="drawer-close" onclick="closeTicketDrawer()" aria-label="Close">×</button>
      </div>
      <div class="drawer-meta" id="drawer-meta"></div>
      <div class="drawer-body" id="drawer-body"></div>
      <div class="drawer-actions"><button class="edit-btn" id="drawer-edit-btn">Edit</button></div>
    </aside>
  </div>

  <script>
    window.addEventListener('load', () => {
      currentSection = 'free-orders';
      renderTickets();
    });
  </script>
  <script src="idle-logout.js"></script>

</body>
</html>
