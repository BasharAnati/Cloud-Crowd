<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign in</title>
  <style>
    :root{
      --navy:#011C40;
      --deep:#023859;
      --steel:#26658C;
      --aqua:#54ACBF;
      --ice:#A7EBF2;
      --text:#eefcff;
      --muted:rgba(238,252,255,.72);
      --soft:rgba(167,235,242,.14);
      --line:rgba(167,235,242,.24);
      --err:#ff6b7a;
      --ok:#65f2c2;
    }
    *{box-sizing:border-box}
    html,body{
      min-height:100%;
      width:100%;
      overflow-x:hidden;
    }
    body{
      position:relative;
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:#010611;
      overflow-x:hidden;
    }
    .bg-video,
    .video-overlay{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }
    .bg-video{
      z-index:0;
      object-fit:cover;
      object-position:center;
      background:#010611;
    }
    .video-overlay{
      z-index:1;
      background:rgba(0,6,18,.55);
    }
    .topbar{
      position:fixed;
      top:24px;
      right:28px;
      z-index:10;
    }
    .home{
      display:inline-flex;
      align-items:center;
      min-height:36px;
      padding:8px 12px;
      border:1px solid rgba(167,235,242,.24);
      border-radius:8px;
      color:rgba(238,252,255,.82);
      text-decoration:none;
      font-size:13px;
      background:rgba(1,28,64,.48);
      backdrop-filter:blur(12px);
      transition:transform .28s ease, border-color .28s ease, color .28s ease, background .28s ease;
    }
    .home:hover{
      transform:translateY(-1px);
      border-color:rgba(167,235,242,.42);
      color:var(--text);
      background:rgba(1,28,64,.62);
    }
    .login-shell{
      position:relative;
      z-index:2;
      min-height:100vh;
      display:grid;
      grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);
      align-items:stretch;
      gap:clamp(28px,5vw,72px);
      width:min(1180px,100%);
      margin:0 auto;
      padding:76px clamp(20px,5vw,64px) 44px;
    }
    .hero-panel{
      position:relative;
      min-height:620px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:clamp(10px,2vw,22px) 0;
      isolation:isolate;
    }
    .hero-panel::before{
      content:"";
      position:absolute;
      left:-18%;
      right:-18%;
      top:13%;
      height:54%;
      z-index:-2;
      background:
        radial-gradient(ellipse at 24% 42%,rgba(84,172,191,.34),transparent 44%),
        radial-gradient(ellipse at 64% 38%,rgba(167,235,242,.22),transparent 42%),
        linear-gradient(90deg,transparent,rgba(84,172,191,.12),transparent);
      filter:blur(30px);
      opacity:.95;
    }
    .brand-lockup{
      position:fixed;
      top:26px;
      left:30px;
      z-index:10;
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:clamp(56px,9vh,96px);
      opacity:0;
      animation:brandIn 1.05s ease-out .12s forwards;
    }
    .brand-logo-link{
      display:inline-flex;
      align-items:center;
      flex:0 0 auto;
      border-radius:14px;
      text-decoration:none;
    }
    .brand-logo-link:focus-visible,
    .brand-name-link:focus-visible,
    .home:focus-visible,
    .btn:focus-visible{
      outline:2px solid rgba(167,235,242,.9);
      outline-offset:4px;
    }
    .brand-lockup img{
      width:64px;
      height:64px;
      object-fit:contain;
      filter:drop-shadow(0 0 10px rgba(167,235,242,.6)) drop-shadow(0 0 28px rgba(84,172,191,.45));
    }
    .brand-text{
      min-width:0;
    }
    .brand-name-link{
      display:inline-block;
      color:inherit;
      text-decoration:none;
    }
    .brand-name{
      margin:0;
      font-size:clamp(24px,3vw,34px);
      line-height:1;
      font-weight:800;
      letter-spacing:0;
    }
    .brand-subtitle{
      margin:6px 0 0;
      color:var(--ice);
      font-size:14px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .hero-copy{
      position:relative;
      width:min(680px,100%);
      padding:52px 0 72px;
      transform:translateX(-36px);
      opacity:0;
      animation:heroCopyIn 1.1s ease-out .34s forwards;
    }
    .headline{
      margin:0;
      max-width:610px;
      font-size:clamp(54px,8vw,112px);
      line-height:.88;
      font-weight:900;
      letter-spacing:0;
      text-transform:uppercase;
      text-shadow:
        0 0 18px rgba(167,235,242,.32),
        0 0 52px rgba(84,172,191,.52),
        0 18px 42px rgba(0,0,0,.74);
    }
    .hero-text{
      max-width:430px;
      margin:24px 0 0;
      color:var(--muted);
      font-size:17px;
      line-height:1.65;
    }
    .hero-footer{
      position:relative;
      min-height:210px;
      display:flex;
      align-items:flex-end;
      border-top:1px solid rgba(167,235,242,.16);
    }
    .trust-note{
      position:relative;
      z-index:1;
      margin:0 0 6px;
      color:rgba(238,252,255,.82);
      font-size:13px;
      letter-spacing:.14em;
      text-transform:uppercase;
    }
    .form-panel{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      min-width:0;
      isolation:isolate;
    }
    .form-panel::before{
      content:"";
      position:absolute;
      width:min(540px,86vw);
      aspect-ratio:1;
      z-index:-1;
      border-radius:50%;
      background:
        radial-gradient(circle,rgba(84,172,191,.26),rgba(84,172,191,.11) 34%,transparent 66%),
        radial-gradient(circle,rgba(167,235,242,.14),transparent 58%);
      filter:blur(42px);
      opacity:.78;
    }
    .card{
      width:100%;
      max-width:430px;
      padding:34px;
      border:1px solid rgba(167,235,242,.22);
      border-radius:20px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.035) 38%,rgba(84,172,191,.045)),
        rgba(1,18,40,.45);
      box-shadow:
        0 34px 95px rgba(0,0,0,.7),
        0 0 52px rgba(84,172,191,.16),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 0 38px rgba(167,235,242,.035);
      backdrop-filter:blur(22px) saturate(132%);
      -webkit-backdrop-filter:blur(22px) saturate(132%);
      position:relative;
      overflow:hidden;
      opacity:0;
      animation:cardIn 1.08s ease-out .5s forwards;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 18% 0%,rgba(255,255,255,.13),transparent 24%),
        linear-gradient(115deg,rgba(255,255,255,.11),transparent 28%,transparent 72%,rgba(167,235,242,.08));
      opacity:.72;
    }
    .card > *{
      position:relative;
      z-index:1;
    }
    .title{
      margin:0;
      font-size:32px;
      line-height:1.15;
      font-weight:800;
      letter-spacing:0;
    }
    .subtitle{
      margin:8px 0 28px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }
    label{
      display:block;
      margin:18px 0 4px;
      color:rgba(238,252,255,.82);
      font-size:13px;
      font-weight:700;
      transition:color .22s ease;
    }
    label:has(+ .input:focus-within){
      color:rgba(167,235,242,.96);
    }
    .input{
      display:flex;
      align-items:center;
      gap:12px;
      min-height:46px;
      padding:0 2px 7px;
      border:0;
      border-bottom:1px solid rgba(167,235,242,.34);
      border-radius:0;
      background:transparent;
      box-shadow:0 1px 0 rgba(255,255,255,.04);
      transition:border-color .22s ease, box-shadow .22s ease;
    }
    .input:focus-within{
      border-bottom-color:var(--ice);
      box-shadow:
        0 1px 0 rgba(167,235,242,.72),
        0 10px 22px -20px rgba(84,172,191,.92);
    }
    .input input{
      width:100%;
      min-width:0;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font:inherit;
      line-height:1.4;
      padding:8px 0 4px;
    }
    .input input::placeholder{color:rgba(238,252,255,.42)}
    .eye{
      flex:0 0 auto;
      width:20px;
      height:20px;
      margin-top:5px;
      color:rgba(167,235,242,.76);
      cursor:pointer;
      transition:color .22s ease, transform .22s ease, filter .22s ease;
    }
    .input:focus-within .eye,
    .eye:hover{
      color:var(--ice);
      filter:drop-shadow(0 0 8px rgba(84,172,191,.28));
    }
    .eye:active{
      transform:scale(.96);
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:12px;
    }
    .checkbox{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0;
      color:rgba(238,252,255,.72);
      font-size:13px;
      user-select:none;
    }
    .checkbox input{accent-color:var(--aqua)}
    .btn{
      width:100%;
      min-height:52px;
      margin-top:22px;
      padding:13px 16px;
      border:0;
      border-radius:12px;
      color:#011328;
      background:linear-gradient(135deg,var(--ice),var(--aqua));
      box-shadow:0 18px 42px rgba(84,172,191,.28);
      font:inherit;
      font-weight:900;
      cursor:pointer;
      transition:transform .24s ease, box-shadow .24s ease, filter .24s ease;
      will-change:transform;
    }
    .btn:hover{
      transform:translateY(-2px);
      box-shadow:
        0 22px 50px rgba(84,172,191,.34),
        0 0 28px rgba(167,235,242,.28);
      filter:saturate(108%);
    }
    .btn:active{
      transform:translateY(0);
      box-shadow:
        0 12px 28px rgba(84,172,191,.24),
        0 0 18px rgba(167,235,242,.18);
    }
    .authorized-note,
    .muted{
      margin:16px 0 0;
      color:rgba(238,252,255,.58);
      font-size:12px;
      line-height:1.5;
      text-align:center;
    }
    .err{
      display:none;
      margin-top:12px;
      color:var(--err);
      font-size:13px;
    }
    .success{
      display:none;
      margin-top:12px;
      color:var(--ok);
      font-size:13px;
    }
    @keyframes brandIn{
      from{
        opacity:0;
        transform:translateY(8px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
    @keyframes heroCopyIn{
      from{
        opacity:0;
        transform:translate(-36px,14px);
      }
      to{
        opacity:1;
        transform:translate(-36px,0);
      }
    }
    @keyframes cardIn{
      from{
        opacity:0;
        transform:translateY(16px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
    @media (min-width:921px){
      html,
      body{
        overflow:hidden;
      }
      .form-panel{
        transform:translateY(-24px);
      }
    }
    @media (max-width:920px){
      body{
        overflow-x:hidden;
        overflow-y:auto;
      }
      .topbar{
        position:fixed;
        right:18px;
      }
      .login-shell{
        min-height:100vh;
        grid-template-columns:1fr;
        gap:30px;
        padding:106px 20px 32px;
      }
      .form-panel{order:1}
      .hero-panel{
        order:2;
        min-height:auto;
        padding:0;
      }
      .brand-lockup{
        top:18px;
        left:18px;
        gap:10px;
        margin-bottom:28px;
      }
      .hero-copy{
        transform:none;
        padding:18px 0 36px;
        animation-name:heroCopyInMobile;
      }
      .headline{
        max-width:100%;
        font-size:clamp(44px,13vw,76px);
      }
      .hero-text{
        max-width:100%;
        font-size:15px;
      }
      .hero-footer{
        min-height:118px;
      }
      .card{
        padding:28px;
        max-width:calc(100vw - 40px);
        backdrop-filter:blur(20px) saturate(136%);
        -webkit-backdrop-filter:blur(20px) saturate(136%);
      }
    }
    @media (max-width:520px){
      .topbar{
        top:14px;
        right:14px;
      }
      .login-shell{
        padding:92px 14px 28px;
      }
      .card{
        padding:24px 18px;
        border-radius:16px;
        max-width:calc(100vw - 28px);
        backdrop-filter:blur(14px) saturate(128%);
        -webkit-backdrop-filter:blur(14px) saturate(128%);
      }
      .title{font-size:28px}
      .brand-lockup img{
        width:52px;
        height:52px;
      }
      .brand-name{font-size:24px}
      .brand-subtitle{font-size:11px}
      .row{
        align-items:flex-start;
      }
      .home{
        font-size:12px;
      }
    }
    @keyframes heroCopyInMobile{
      from{
        opacity:0;
        transform:translateY(14px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
    @media (prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
        transition-duration:.01ms !important;
      }
      .brand-lockup,
      .hero-copy,
      .card{
        opacity:1;
        animation:none;
      }
      .hero-copy{
        transform:translateX(-36px);
      }
      .btn:hover,
      .btn:active,
      .home:hover{
        transform:none;
      }
    }
    @media (prefers-reduced-motion:reduce) and (max-width:920px){
      .hero-copy{
        transform:none;
      }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay loop muted playsinline aria-hidden="true">
    <source src="assets/videos/cloudcrowd-bg.mp4" type="video/mp4">
  </video>
  <div class="video-overlay" aria-hidden="true"></div>
  <div class="topbar"><a class="home" href="index.html">← Back to site</a></div>

  <main class="login-shell">
    <section class="hero-panel" aria-label="Cloud Crowd">
      <div>
        <div class="brand-lockup">
          <a class="brand-logo-link" href="index.html" aria-label="Cloud Crowd home">
            <img src="logo.png" alt="Cloud Crowd logo">
          </a>
          <div class="brand-text">
            <a class="brand-name-link" href="index.html">
              <h1 class="brand-name">Cloud Crowd</h1>
            </a>
            <p class="brand-subtitle">Operational Support Services</p>
          </div>
        </div>

        <div class="hero-copy">
          <h2 class="headline">WELCOME BACK</h2>
          <p class="hero-text">Join us and organize your work quickly and conveniently.</p>
        </div>
      </div>

      <div class="hero-footer">
        <p class="trust-note">Secure. Reliable. Always.</p>
      </div>
    </section>

    <section class="form-panel" aria-label="Sign in">
      <div class="card">
        <h2 class="title">Sign in</h2>
        <p class="subtitle">Access your account to continue</p>

        <form id="form">
          <label for="username">Username</label>
          <div class="input"><input id="username" name="username" autocomplete="username" required placeholder="Enter your username"></div>

          <label for="password">Password</label>
          <div class="input">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <svg id="togglePwd" class="eye" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </div>

          <div class="row">
            <label class="checkbox"><input type="checkbox" id="remember"> Remember me</label>
            <a class="home" href="index.html">Back</a>
          </div>

          <button class="btn" type="submit">Sign in</button>
          <div id="error" class="err">Invalid credentials</div>
          <div id="ok" class="success">Success! Redirecting…</div>
          <p class="authorized-note">Authorized team members only</p>
        </form>
      </div>
    </section>
  </main>
<script>
  // Show / hide password
  document.getElementById('togglePwd').addEventListener('click', () => {
    const i = document.getElementById('password');
    i.type = i.type === 'password' ? 'text' : 'password';
  });

  /* ===========================
     ✅ OLD LOGIN FLOW (ENABLED)
     =========================== */
  const form = document.getElementById('form');
  const expired = new URLSearchParams(window.location.search).get('expired') === '1';
  if (expired) {
    const err = document.getElementById('error');
    err.textContent = 'Your session expired. Please sign in again.';
    err.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const err = document.getElementById('error');
    const ok  = document.getElementById('ok');
    err.style.display = 'none';
    ok.style.display  = 'none';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/.netlify/functions/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json().catch(() => ({}));

      if (res.ok && data?.success && data?.sessionToken) {
        localStorage.setItem('cc_auth', '1');
        localStorage.setItem('cc_user', data.username || username);
        localStorage.setItem('cc_role', data.role || 'agent');
        localStorage.setItem('cc_token', data.sessionToken);

        ok.textContent = 'Success! Redirecting…';
        ok.style.display = 'block';

        setTimeout(() => { window.location.href = "dashboard.html"; }, 700);
      } else {
        err.textContent = data?.message || 'Invalid credentials';
        err.style.display = 'block';
      }
    } catch {
      err.textContent = 'Network error — try again';
      err.style.display = 'block';
    }
  });

  /* ===========================
     🛠 Maintenance Mode (DISABLED)
     ===========================
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    window.location.href = "system-update.html";
  });
  */
</script>
</body>
</html>
