<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <title>Call Queue - Cloud Crowd</title>
  <script src="assets/js/theme.js"></script>
  <script src="assets/vendor/lucide/lucide-subset.js"></script>
  <script src="assets/js/components/buttons.js"></script>
  <script src="assets/js/components/icons.js"></script>
  <script src="assets/js/components/feedback.js"></script>
  <script src="assets/js/components/confirmation.js"></script>
  <script src="assets/js/components/status-registry.js"></script>
  <link rel="stylesheet" href="assets/css/design-tokens.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="assets/css/theme-base.css">
  <style>
    *{box-sizing:border-box}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .workspace{
      display:grid;
      grid-template-columns:minmax(330px,.82fr) minmax(0,1.18fr);
      gap:18px;
      align-items:start;
    }
    .panel{
      border:1px solid rgba(167,235,242,.18);
      border-radius:18px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.035) 46%,rgba(84,172,191,.055)),
        var(--glass-strong);
      box-shadow:0 22px 70px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter:blur(16px) saturate(126%);
      -webkit-backdrop-filter:blur(16px) saturate(126%);
    }
    .queue-panel{padding:16px;max-height:calc(100vh - 230px);overflow:auto}
    .workspace-panel{padding:22px;min-height:620px}
    .status-group + .status-group{margin-top:16px}
    .status-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
      color:rgba(238,252,255,.82);
      font-size:12px;
      font-weight:900;
      letter-spacing:.1em;
      text-transform:uppercase;
    }
    .count{
      display:inline-flex;
      min-width:24px;
      height:24px;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      color:var(--ice);
      background:rgba(84,172,191,.14);
      border:1px solid rgba(167,235,242,.2);
    }
    .ticket{
      width:100%;
      display:block;
      padding:14px;
      margin-bottom:8px;
      border:1px solid rgba(167,235,242,.14);
      border-radius:14px;
      color:var(--text);
      text-align:left;
      background:rgba(1,16,34,.54);
      transition:transform .18s ease,border-color .18s ease,background .18s ease;
    }
    .ticket:hover,.ticket.active{
      transform:translateY(-1px);
      border-color:rgba(167,235,242,.38);
      background:rgba(84,172,191,.12);
    }
    .ticket strong{display:block;font-size:15px}
    .ticket span{display:block;margin-top:4px;color:var(--muted);font-size:12px}
    .ticket-meta{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:10px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      min-height:24px;
      padding:4px 8px;
      border-radius:999px;
      color:rgba(238,252,255,.76);
      background:rgba(255,255,255,.07);
      font-size:11px;
      font-weight:800;
    }
    .empty-state{
      padding:34px;
      text-align:center;
      color:var(--muted);
    }
    .detail-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }
    .detail-head h2{margin:0;font-size:28px;line-height:1.1}
    .status-badge{
      flex:0 0 auto;
      padding:8px 11px;
      border:1px solid rgba(167,235,242,.22);
      border-radius:999px;
      color:var(--ice);
      background:rgba(84,172,191,.13);
      font-size:12px;
      font-weight:900;
      text-transform:uppercase;
    }
    .info-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
      margin-bottom:18px;
    }
    .info{
      padding:12px;
      border:1px solid rgba(167,235,242,.13);
      border-radius:12px;
      background:rgba(1,16,34,.42);
    }
    .info span{
      display:block;
      margin-bottom:5px;
      color:rgba(238,252,255,.52);
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
    }
    .info strong{
      display:block;
      color:var(--text);
      overflow-wrap:anywhere;
    }
    .image-box{
      min-height:220px;
      display:grid;
      place-items:center;
      overflow:hidden;
      margin-bottom:18px;
      border:1px solid rgba(167,235,242,.16);
      border-radius:16px;
      background:
        linear-gradient(135deg,rgba(84,172,191,.12),rgba(255,255,255,.04)),
        rgba(1,16,34,.52);
    }
    .image-box img{
      width:100%;
      height:100%;
      max-height:360px;
      object-fit:cover;
      display:block;
    }
    .placeholder-art{
      display:grid;
      place-items:center;
      gap:10px;
      color:rgba(238,252,255,.54);
      text-align:center;
      font-weight:800;
    }
    .notes-box{
      margin-bottom:18px;
      padding:14px;
      border:1px solid rgba(167,235,242,.13);
      border-radius:14px;
      background:rgba(1,16,34,.42);
    }
    .notes-box h4,.actions h4{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ice)}
    .latest-note{margin:0 0 12px;color:var(--muted);font-size:14px}
    textarea,input{
      width:100%;
      border:1px solid rgba(167,235,242,.22);
      border-radius:12px;
      outline:0;
      color:var(--text);
      background:rgba(1,12,26,.56);
    }
    textarea{min-height:90px;padding:12px;resize:vertical}
    input{min-height:42px;padding:10px 12px}
    textarea:focus,input:focus{
      border-color:var(--ice);
      box-shadow:0 0 0 4px rgba(84,172,191,.13);
    }
    .action-row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:12px;
    }
    .btn{
      min-height:42px;
      padding:10px 14px;
      border:0;
      border-radius:12px;
      color:#011328;
      background:linear-gradient(135deg,var(--ice),var(--aqua));
      box-shadow:0 14px 34px rgba(84,172,191,.2);
      font-weight:900;
      transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 18px 42px rgba(84,172,191,.28)}
    .btn.secondary{color:var(--text);background:rgba(84,172,191,.13);border:1px solid rgba(167,235,242,.22)}
    .btn.warning{color:#1c1301;background:linear-gradient(135deg,#ffe5a3,var(--warn))}
    .btn.danger{color:#25030a;background:linear-gradient(135deg,#ffc5cc,var(--bad))}
    .btn:disabled{opacity:.48;cursor:not-allowed;transform:none;box-shadow:none}
    .negative-details{
      display:none;
      margin-top:14px;
      padding:14px;
      border:1px solid rgba(246,199,107,.3);
      border-radius:14px;
      background:rgba(246,199,107,.07);
    }
    .negative-details.open{display:block}
    .negative-details label{
      display:block;
      margin:10px 0 6px;
      color:rgba(238,252,255,.74);
      font-size:12px;
      font-weight:900;
      text-transform:uppercase;
    }
    @media (max-width:1080px){
      .workspace{grid-template-columns:1fr}
      .queue-panel{max-height:none}
    }
    @media (max-width:680px){
      .workspace-panel{padding:18px}
      .info-grid{grid-template-columns:1fr}
      .detail-head{display:block}
      .status-badge{display:inline-flex;margin-top:12px}
    }
  </style>
  <link rel="stylesheet" href="assets/css/pages/admin-call-queue.css">
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/maintenance.js" defer></script>
  <script src="js/app-shell.js" defer></script>
  <script src="js/internal-page-shell.js" defer></script>
  <link rel="stylesheet" href="assets/css/layouts/page-layout.css">
  <link rel="stylesheet" href="assets/css/components/buttons.css">
  <link rel="stylesheet" href="assets/css/components/icons.css">
  <link rel="stylesheet" href="assets/css/components/feedback.css">
  <link rel="stylesheet" href="assets/css/components/cards.css">
  <link rel="stylesheet" href="assets/css/components/status.css">
  <link rel="stylesheet" href="assets/css/components/forms.css">
</head>
<body class="admin-call-queue-page call-queue-page" data-shell-module="call-queue" data-shell-user-id="call-queue-shell-user" data-shell-role-id="call-queue-shell-role">
  <script>
    if (readSessionValue('cc_auth') !== '1' || !readSessionValue('cc_token') || !readSessionValue('cc_role')) {
      clearStoredSession();
      window.location.href = 'login.html';
    }

    const allowedCallQueueRoles = ['admin', 'manager'];
    const currentCallQueueRole = (sessionStorage.getItem('cc_role') || '').toLowerCase();
    if (!allowedCallQueueRoles.includes(currentCallQueueRole)) {
      window.location.href = 'dashboard.html';
    }
  </script>

  <div id="internal-page-shell" class="cc-shell-layout has-responsive-navigation">
    <aside id="internal-app-sidebar" aria-label="Application navigation"></aside>

    <main class="cc-shell-main" id="main-content">
      <header id="internal-app-topbar" role="banner">
        <button id="maintenance-toggle-btn" class="cc-shell-maintenance-toggle" type="button" aria-pressed="false" hidden>OFF</button>
      </header>

      <div class="admin-call-queue-container call-queue-container cc-page-container cc-page-container--workspace">
        <header class="cc-page-header">
          <div class="cc-page-header-content">
            <p class="cc-page-header-context">Call Operations</p>
            <h1 class="cc-page-header-title" id="page-title">Call Queue</h1>
            <p class="cc-page-header-description">Dedicated customer follow-up workspace for moving calls from Need Call through In Call, Called, Pending, and Done.</p>
          </div>
        </header>

        <section class="workspace cc-form" aria-label="Call queue workspace">
          <div class="panel queue-panel" id="queue-list"></div>

          <div class="panel workspace-panel" id="workspace-panel">
            <div class="empty-state cc-empty-state">Select a call ticket to open the workspace.</div>
          </div>
        </section>
      </div>
    </main>
    <button id="internal-nav-backdrop" class="cc-shell-nav-backdrop" type="button" aria-label="Close application navigation" tabindex="-1" hidden></button>
  </div>

  <script>
    const STORAGE_KEY = 'cc_call_queue_tickets_v1';
    const STATUSES = ['Need Call', 'In Call', 'Called', 'Pending', 'Done'];
    let tickets = loadTickets();
    let selectedTicketId = tickets[0]?.id || null;

    function nowLabel() {
      return new Date().toLocaleString([], {
        year: 'numeric',
        month: 'short',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function seedTickets() {
      const updated = nowLabel();
      return [
        {
          id: 'CQ-1001',
          customerName: 'Maya Haddad',
          phone: '+962 79 000 1122',
          branch: 'Abdoun',
          restaurant: 'Cloud Crowd Kitchen',
          orderNumber: 'ORD-84291',
          callReason: 'Follow up after delayed delivery',
          orderImage: '',
          assignedTo: '',
          status: 'Need Call',
          notes: ['Customer reported the order arrived 35 minutes late.'],
          negativeReason: '',
          lastUpdated: updated
        },
        {
          id: 'CQ-1002',
          customerName: 'Omar Saleh',
          phone: '+962 78 000 3344',
          branch: 'Swefieh',
          restaurant: 'Cloud Crowd Kitchen',
          orderNumber: 'ORD-84308',
          callReason: 'Confirm compensation satisfaction',
          orderImage: '',
          assignedTo: 'Supervisor',
          status: 'Pending',
          notes: ['Customer asked for a callback after 6 PM.'],
          negativeReason: 'Customer unavailable',
          lastUpdated: updated
        },
        {
          id: 'CQ-1003',
          customerName: 'Lina Nasser',
          phone: '+962 77 000 5566',
          branch: 'Khalda',
          restaurant: 'Partner Restaurant',
          orderNumber: 'ORD-84342',
          callReason: 'Validate missing item complaint',
          orderImage: '',
          assignedTo: '',
          status: 'Need Call',
          notes: ['Missing drink reported by customer support.'],
          negativeReason: '',
          lastUpdated: updated
        }
      ];
    }

    function loadTickets() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (Array.isArray(saved) && saved.length) return saved;
      } catch {}
      const seeded = seedTickets();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
      return seeded;
    }

    function saveTickets() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
    }

    function getCurrentUser() {
      return sessionStorage.getItem('cc_user') || 'Team Member';
    }

    function findTicket() {
      return tickets.find((ticket) => ticket.id === selectedTicketId) || null;
    }

    function queueStatusBadge(status) {
      const registry = window.CloudCrowdStatusRegistry;
      const presentation = registry ? registry.get('call-queue', status) : { label: status || '-' };
      const toneClass = registry ? registry.getToneClass('call-queue', status) : 'cc-status--neutral';
      return `<span class="status-badge cc-status ${toneClass}">${escapeHtml(presentation.label)}</span>`;
    }

    function renderQueue() {
      const queue = document.getElementById('queue-list');
      queue.innerHTML = STATUSES.map((status) => {
        const group = tickets.filter((ticket) => ticket.status === status);
        const cards = group.map((ticket) => `
          <button class="ticket cc-card ${ticket.id === selectedTicketId ? 'active' : ''}" type="button" data-ticket-id="${ticket.id}">
            <strong>${escapeHtml(ticket.customerName)}</strong>
            <span>${escapeHtml(ticket.phone)} · ${escapeHtml(ticket.orderNumber)}</span>
            <div class="ticket-meta">
              <span class="chip">${escapeHtml(ticket.branch)}</span>
              <span class="chip">${escapeHtml(ticket.assignedTo || 'Unassigned')}</span>
            </div>
          </button>
        `).join('');

        return `
          <section class="status-group">
            <div class="status-head">
              <span>${status}</span>
              <span class="count">${group.length}</span>
            </div>
            ${cards || '<div class="empty-state">No tickets</div>'}
          </section>
        `;
      }).join('');

      queue.querySelectorAll('[data-ticket-id]').forEach((button) => {
        button.addEventListener('click', () => {
          selectedTicketId = button.dataset.ticketId;
          render();
        });
      });
    }

    function renderWorkspace() {
      const panel = document.getElementById('workspace-panel');
      const ticket = findTicket();
      if (!ticket) {
        panel.innerHTML = '<div class="empty-state">Select a call ticket to open the workspace.</div>';
        return;
      }

      const latestNote = ticket.notes[ticket.notes.length - 1] || 'No notes yet.';
      panel.innerHTML = `
        <div class="detail-head">
          <div>
            <h2 class="cc-section-title">${escapeHtml(ticket.customerName)}</h2>
            <div class="chip">${escapeHtml(ticket.id)}</div>
          </div>
          ${queueStatusBadge(ticket.status)}
        </div>

        <div class="info-grid">
          <div class="info"><span>Phone Number</span><strong>${escapeHtml(ticket.phone)}</strong></div>
          <div class="info"><span>Order Number</span><strong>${escapeHtml(ticket.orderNumber)}</strong></div>
          <div class="info"><span>Branch</span><strong>${escapeHtml(ticket.branch)}</strong></div>
          <div class="info"><span>Restaurant</span><strong>${escapeHtml(ticket.restaurant)}</strong></div>
          <div class="info"><span>Call Reason</span><strong>${escapeHtml(ticket.callReason)}</strong></div>
          <div class="info"><span>Assigned To</span><strong>${escapeHtml(ticket.assignedTo || 'Unassigned')}</strong></div>
          <div class="info"><span>Last Updated</span><strong>${escapeHtml(ticket.lastUpdated)}</strong></div>
          <div class="info"><span>Negative Reason</span><strong>${escapeHtml(ticket.negativeReason || 'None')}</strong></div>
        </div>

        <div class="image-box">
          ${ticket.orderImage ? `<img src="${escapeAttribute(ticket.orderImage)}" alt="Order image for ${escapeAttribute(ticket.orderNumber)}">` : `
            <div class="placeholder-art">
              <svg width="54" height="54" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 6h16v12H4V6Z" stroke="currentColor" stroke-width="1.5"/>
                <path d="m7 15 3-3 2 2 2.5-2.5L18 15" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="8.5" cy="9.5" r="1" fill="currentColor"/>
              </svg>
              <span>Order image placeholder</span>
            </div>
          `}
        </div>

        <div class="notes-box">
          <h3>Latest Note</h3>
          <p class="latest-note">${escapeHtml(latestNote)}</p>
          <textarea id="note-input" class="cc-control" placeholder="Add a call note" aria-label="Add a call note"></textarea>
          <div class="action-row">
            <button class="btn secondary" type="button" id="add-note-btn">Add Note</button>
          </div>
        </div>

        <div class="actions">
          <h3>Call Actions</h3>
          <div class="action-row">
            <button class="btn" type="button" id="start-call-btn" ${ticket.status !== 'Need Call' ? 'disabled' : ''}>Start Call</button>
            <button class="btn" type="button" id="positive-btn" ${ticket.status !== 'In Call' ? 'disabled' : ''}>Positive Result</button>
            <button class="btn warning" type="button" id="negative-btn" ${ticket.status !== 'In Call' ? 'disabled' : ''}>Negative Result</button>
            <button class="btn secondary" type="button" id="done-btn" ${ticket.status !== 'Called' && ticket.status !== 'Pending' ? 'disabled' : ''}>Move to Done</button>
          </div>
          <div class="negative-details" id="negative-details">
            <label for="negative-reason">Reason</label>
            <input id="negative-reason" class="cc-control" placeholder="Example: No answer, customer busy">
            <label for="negative-note">Note</label>
            <textarea id="negative-note" class="cc-control" placeholder="Add details for the pending follow-up"></textarea>
            <div class="action-row">
              <button class="btn cc-button cc-button--warning cc-button--md" type="button" id="save-negative-btn">Save Negative Result</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('add-note-btn').addEventListener('click', addNote);
      document.getElementById('start-call-btn').addEventListener('click', startCall);
      document.getElementById('positive-btn').addEventListener('click', positiveResult);
      document.getElementById('negative-btn').addEventListener('click', () => {
        document.getElementById('negative-details').classList.add('open');
      });
      document.getElementById('save-negative-btn').addEventListener('click', negativeResult);
      document.getElementById('done-btn').addEventListener('click', moveToDone);
    }

    function updateTicket(patch) {
      const ticket = findTicket();
      if (!ticket) return;
      Object.assign(ticket, patch, { lastUpdated: nowLabel() });
      saveTickets();
      render();
    }

    function addNote() {
      const ticket = findTicket();
      const input = document.getElementById('note-input');
      const value = input.value.trim();
      if (!ticket || !value) return;
      ticket.notes.push(`${getCurrentUser()}: ${value}`);
      ticket.lastUpdated = nowLabel();
      saveTickets();
      render();
    }

    function startCall() {
      updateTicket({
        status: 'In Call',
        assignedTo: getCurrentUser()
      });
    }

    function positiveResult() {
      const ticket = findTicket();
      if (!ticket) return;
      ticket.notes.push(`${getCurrentUser()}: Positive call result.`);
      updateTicket({ status: 'Called' });
    }

    function negativeResult() {
      const ticket = findTicket();
      const reason = document.getElementById('negative-reason').value.trim();
      const note = document.getElementById('negative-note').value.trim();
      if (!ticket || !reason) return;
      ticket.notes.push(`${getCurrentUser()}: Negative result - ${reason}${note ? `. ${note}` : ''}`);
      updateTicket({
        status: 'Pending',
        negativeReason: reason
      });
    }

    function moveToDone() {
      const ticket = findTicket();
      if (!ticket) return;
      ticket.notes.push(`${getCurrentUser()}: Moved ticket to Done.`);
      updateTicket({ status: 'Done' });
    }

    function render() {
      renderQueue();
      renderWorkspace();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    render();
  </script>
  <script src="idle-logout.js"></script>
</body>
</html>
