<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <title>Cloud Crowd - Customer Experience</title>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/design-tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="assets/css/theme-base.css">
  <link rel="stylesheet" href="media-viewer.css">
  <script>
    const MAINTENANCE_ADMIN = "Anati";
    const MAINTENANCE_ENDPOINT = "/.netlify/functions/maintenance";

    function isMaintenanceAdmin() {
      return sessionStorage.getItem("cc_auth") === "1" &&
        sessionStorage.getItem("cc_role") === "admin" &&
        sessionStorage.getItem("cc_user") === MAINTENANCE_ADMIN;
    }

    async function fetchMaintenanceStatus() {
      try {
        const response = await fetch(MAINTENANCE_ENDPOINT, {
          cache: "no-store",
          headers: {
            'Authorization': `Bearer ${sessionStorage.getItem('cc_token') || ''}`
          }
        });
        if (!response.ok) throw new Error(`Maintenance check failed: ${response.status}`);
        const data = await response.json();
        return {
          maintenance: data.maintenance === true,
          admin: data.admin === true
        };
      } catch (err) {
        console.warn("Maintenance check failed.", err);
        return null;
      }
    }

    async function enforceMaintenanceMode() {
      const status = await fetchMaintenanceStatus();
      if (status?.maintenance === true && status.admin !== true) {
        window.location.href = "system-update.html";
      }
    }

    enforceMaintenanceMode();
    setInterval(enforceMaintenanceMode, 3000);
  </script>
  <script>
    if (sessionStorage.getItem('cc_auth') !== '1' || !sessionStorage.getItem('cc_token') || !sessionStorage.getItem('cc_role')) {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }
  </script>
  <script src="js/permissions.js"></script>
  <script>
    window.CCPermissions?.requirePageAccess('customer_experience');
  </script>
  <script src="js/app-shell.js" defer></script>
  <script src="shared/ticket-domain-config.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/tickets-render.js" defer></script>
  <script src="js/media-viewer.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body class="ce-page ce-ops-center">
  <div class="ce-module-shell cc-shell-layout">
    <aside id="ce-app-sidebar" aria-label="Customer Experience navigation"></aside>

    <main class="ce-workspace ce-main-area" id="main-content">
      <header id="ce-app-topbar" role="banner"></header>

      <section class="ce-hero" aria-labelledby="ce-page-title">
        <div class="ce-hero-copy">
          <h2 id="ce-page-title">Customer Experience Operations Center</h2>
          <p>Track customer feedback, order issues, callbacks, and resolution progress.</p>
        </div>
        <div class="ce-actions">
          <button class="add-ticket-btn" type="button" onclick="openModal('ce')" data-permission-create>Add New Ticket</button>
        </div>
      </section>

    <section class="ce-stats" aria-label="Customer Experience case summary">
      <article class="ce-stat-card ce-stat-total">
        <span class="ce-stat-icon" aria-hidden="true"></span>
        <span class="ce-stat-label">Total Cases</span>
        <strong id="ce-stat-total">0</strong>
      </article>
      <article class="ce-stat-card ce-stat-review">
        <span class="ce-stat-icon" aria-hidden="true"></span>
        <span class="ce-stat-label">Under Review</span>
        <strong id="ce-stat-under-review">0</strong>
      </article>
      <article class="ce-stat-card ce-stat-pending">
        <span class="ce-stat-icon" aria-hidden="true"></span>
        <span class="ce-stat-label">Pending Call Back</span>
        <strong id="ce-stat-pending">0</strong>
      </article>
      <article class="ce-stat-card ce-stat-closed">
        <span class="ce-stat-icon" aria-hidden="true"></span>
        <span class="ce-stat-label">Closed</span>
        <strong id="ce-stat-closed">0</strong>
      </article>
    </section>

    <section class="ce-filters" aria-label="Customer Experience filters">
      <div class="ce-filter-field ce-filter-search">
        <label for="ce-search">Search</label>
        <input id="ce-search" type="search" placeholder="Order, customer, or phone">
      </div>
      <div class="ce-filter-field">
        <label for="ce-status-filter">Status</label>
        <select id="ce-status-filter">
          <option value="">All statuses</option>
        </select>
      </div>
      <div class="ce-filter-field">
        <label for="ce-branch-filter">Branch</label>
        <select id="ce-branch-filter">
          <option value="">All branches</option>
        </select>
      </div>
      <div class="ce-filter-field">
        <label for="ce-restaurant-filter">Restaurant</label>
        <select id="ce-restaurant-filter">
          <option value="">All restaurants</option>
        </select>
      </div>
    </section>

    <div class="ticket-list ce-board" id="ticket-list">
      <div id="tickets"></div>
    </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>Add New Ticket</h2>
      <form id="ticket-form">
        <div id="dynamic-form"></div>
        <div class="form-actions">
          <button type="submit" class="submit-btn">Submit</button>
          <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Details Drawer -->
  <div class="drawer" id="ticket-drawer" aria-hidden="true">
    <div class="drawer-backdrop" onclick="closeTicketDrawer()"></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-header">
        <div>
          <div class="drawer-case">Order Number: <span id="drawer-caseNumber"></span></div>
          <h2 id="drawer-title">Details</h2>
        </div>
        <button class="drawer-close" onclick="closeTicketDrawer()" aria-label="Close">×</button>
      </div>
      <div class="drawer-meta" id="drawer-meta"></div>
      <div class="drawer-body" id="drawer-body"></div>
      <div class="drawer-actions"><button class="edit-btn" id="drawer-edit-btn">Edit</button></div>
    </aside>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }

    window.addEventListener('load', () => {
      CloudCrowdAppShell.buildSidebar(document.getElementById('ce-app-sidebar'));
      CloudCrowdAppShell.buildTopbar(document.getElementById('ce-app-topbar'), {
        eyebrow: 'Operations Hub',
        title: 'Customer Experience',
        userId: 'ce-current-user',
        roleId: 'ce-current-role',
        onLogout: logout
      });
      currentSection = 'ce';
      renderTickets();
    });
  </script>
  <script src="idle-logout.js"></script>

</body>
</html>
