<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <title>Cloud Crowd - Service Management Platform</title>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/design-tokens.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="assets/css/theme-base.css">
  <link rel="stylesheet" href="assets/css/pages/dashboard.css">

  <script src="js/auth.js"></script>
  <script>
    if (readSessionValue('cc_auth') !== '1' || !readSessionValue('cc_token') || !readSessionValue('cc_role')) {
      clearStoredSession();
      window.location.href = 'login.html';
    }
  </script>
  <script src="js/permissions.js"></script>
  <script src="js/maintenance.js" defer></script>
  <script src="js/app-shell.js" defer></script>
  <script src="js/dashboard.js" defer></script>
  <link rel="stylesheet" href="assets/css/layouts/page-layout.css">
</head>
<body class="dashboard-page">
  <div id="dashboard-shell" class="cc-shell-layout has-responsive-navigation">
    <aside id="dashboard-app-sidebar" aria-label="Application navigation"></aside>

    <main class="cc-shell-main" id="main-content">
      <header id="dashboard-app-topbar" role="banner">
        <button
          id="maintenance-toggle-btn"
          class="cc-shell-maintenance-toggle"
          type="button"
          aria-pressed="false"
          hidden
        >OFF</button>
      </header>

      <div class="dashboard-page-container cc-page-container cc-page-container--standard">
        <header class="cc-page-header">
          <div class="cc-page-header-content">
            <p class="cc-page-header-context">Service Management Platform</p>
            <h1 class="cc-page-header-title">Operations Dashboard</h1>
            <p class="cc-page-header-description">Monitor service workflows, document operational cases, and move quickly into the sections your team uses every day.</p>
          </div>
        </header>

        <div id="dashboard-modules" class="dashboard-module-groups" aria-label="Available modules"></div>
      </div>
    </main>

    <button
      id="dashboard-nav-backdrop"
      class="cc-shell-nav-backdrop"
      type="button"
      aria-label="Close application navigation"
      tabindex="-1"
      hidden
    ></button>
  </div>

  <script src="idle-logout.js"></script>
</body>
</html>
