<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <title>Cloud Crowd - Daily Complaints</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="media-viewer.css">
  <script>
    const MAINTENANCE_ADMIN = "Anati";
    const MAINTENANCE_ENDPOINT = "/.netlify/functions/maintenance";

    function isMaintenanceAdmin() {
      return sessionStorage.getItem("cc_auth") === "1" &&
        sessionStorage.getItem("cc_role") === "admin" &&
        sessionStorage.getItem("cc_user") === MAINTENANCE_ADMIN;
    }

    async function fetchMaintenanceStatus() {
      try {
        const response = await fetch(MAINTENANCE_ENDPOINT, {
          cache: "no-store",
          headers: {
            'Authorization': `Bearer ${sessionStorage.getItem('cc_token') || ''}`
          }
        });
        if (!response.ok) throw new Error(`Maintenance check failed: ${response.status}`);
        const data = await response.json();
        return {
          maintenance: data.maintenance === true,
          admin: data.admin === true
        };
      } catch (err) {
        console.warn("Maintenance check failed.", err);
        return null;
      }
    }

    async function enforceMaintenanceMode() {
      const status = await fetchMaintenanceStatus();
      if (status?.maintenance === true && status.admin !== true) {
        window.location.href = "system-update.html";
      }
    }

    enforceMaintenanceMode();
    setInterval(enforceMaintenanceMode, 3000);
  </script>
  <script>
    if (sessionStorage.getItem('cc_auth') !== '1' || !sessionStorage.getItem('cc_token') || !sessionStorage.getItem('cc_role')) {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }
  </script>
  <script src="js/permissions.js"></script>
  <script>
    window.CCPermissions?.requirePageAccess('daily_complaints');
  </script>
  <script src="js/app-shell.js" defer></script>
  <script src="shared/ticket-domain-config.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/tickets-render.js" defer></script>
  <script src="js/media-viewer.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body class="complaints-page complaints-ops-center">
  <div class="complaints-module-shell cc-shell-layout">
    <aside id="complaints-app-sidebar" aria-label="Daily Complaints navigation"></aside>

    <main class="complaints-workspace complaints-main-area" id="main-content">
      <header id="complaints-app-topbar" role="banner"></header>

      <section class="complaints-hero" aria-labelledby="complaints-page-title">
        <div class="complaints-hero-copy">
          <h2 id="complaints-page-title">Daily Complaints Operations Center</h2>
          <p>Track complaint cases, responsible departments, customer impact, and resolution progress.</p>
        </div>
        <div class="complaints-actions">
          <button class="add-ticket-btn" type="button" onclick="openModal('complaints')" data-permission-create>Add New Ticket</button>
        </div>
      </section>

      <section class="complaints-stats" aria-label="Daily Complaints summary">
        <article class="complaints-stat-card complaints-stat-total">
          <span class="complaints-stat-icon" aria-hidden="true"></span>
          <span class="complaints-stat-label">Total Complaints</span>
          <strong id="complaints-stat-total">0</strong>
        </article>
        <article class="complaints-stat-card complaints-stat-review">
          <span class="complaints-stat-icon" aria-hidden="true"></span>
          <span class="complaints-stat-label">Under Review</span>
          <strong id="complaints-stat-under-review">0</strong>
        </article>
        <article class="complaints-stat-card complaints-stat-pending">
          <span class="complaints-stat-icon" aria-hidden="true"></span>
          <span class="complaints-stat-label">Pending Call Back</span>
          <strong id="complaints-stat-pending">0</strong>
        </article>
        <article class="complaints-stat-card complaints-stat-escalated">
          <span class="complaints-stat-icon" aria-hidden="true"></span>
          <span class="complaints-stat-label">Escalated</span>
          <strong id="complaints-stat-escalated">0</strong>
        </article>
        <article class="complaints-stat-card complaints-stat-closed">
          <span class="complaints-stat-icon" aria-hidden="true"></span>
          <span class="complaints-stat-label">Closed</span>
          <strong id="complaints-stat-closed">0</strong>
        </article>
      </section>

      <section class="complaints-filters" aria-label="Daily Complaints filters">
        <div class="complaints-filter-field complaints-filter-search">
          <label for="complaints-search">Search</label>
          <input id="complaints-search" type="search" placeholder="Order, case, customer, or phone">
        </div>
        <div class="complaints-filter-field">
          <label for="complaints-status-filter">Status</label>
          <select id="complaints-status-filter">
            <option value="">All statuses</option>
          </select>
        </div>
        <div class="complaints-filter-field">
          <label for="complaints-branch-filter">Branch</label>
          <select id="complaints-branch-filter">
            <option value="">All branches</option>
          </select>
        </div>
        <div class="complaints-filter-field">
          <label for="complaints-restaurant-filter">Restaurant</label>
          <select id="complaints-restaurant-filter">
            <option value="">All restaurants</option>
          </select>
        </div>
        <div class="complaints-filter-field">
          <label for="complaints-issue-filter">Issue Category</label>
          <select id="complaints-issue-filter">
            <option value="">All issues</option>
          </select>
        </div>
      </section>

      <div class="ticket-list complaints-board" id="ticket-list">
        <div id="tickets"></div>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>Add New Ticket</h2>
      <form id="ticket-form">
        <div id="dynamic-form"></div>
        <div class="form-actions">
          <button type="submit" class="submit-btn">Submit</button>
          <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="drawer" id="ticket-drawer" aria-hidden="true">
    <div class="drawer-backdrop" onclick="closeTicketDrawer()"></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-header">
        <div>
          <div class="drawer-case">Order Number: <span id="drawer-caseNumber"></span></div>
          <h2 id="drawer-title">Details</h2>
        </div>
        <button class="drawer-close" onclick="closeTicketDrawer()" aria-label="Close">x</button>
      </div>
      <div class="drawer-meta" id="drawer-meta"></div>
      <div class="drawer-body" id="drawer-body"></div>
      <div class="drawer-actions"><button class="edit-btn" id="drawer-edit-btn">Edit</button></div>
    </aside>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }

    window.addEventListener('load', () => {
      CloudCrowdAppShell.buildSidebar(
        document.getElementById("complaints-app-sidebar")
      );

      CloudCrowdAppShell.buildTopbar(
        document.getElementById("complaints-app-topbar"),
        {
          eyebrow: "Operations Hub",
          title: "Daily Complaints",
          userId: "complaints-current-user",
          roleId: "complaints-current-role",
          onLogout: logout
        }
      );

      currentSection = 'complaints';
      renderTickets();
    });
  </script>
  <script src="idle-logout.js"></script>
</body>
</html>
