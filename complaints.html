<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <title>Cloud Crowd - Daily Complaints</title>
  <script src="assets/js/theme.js"></script>
  <script src="assets/vendor/lucide/lucide-subset.js"></script>
  <script src="assets/js/components/buttons.js"></script>
  <script src="assets/js/components/icons.js"></script>
  <script src="assets/js/components/feedback.js"></script>
  <script src="assets/js/components/dialog.js"></script>
  <script src="assets/js/components/confirmation.js"></script>
  <script src="assets/js/components/status-registry.js"></script>
  <link rel="stylesheet" href="assets/css/design-tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="assets/css/theme-base.css">
  <link rel="stylesheet" href="media-viewer.css">
  <script src="js/maintenance.js"></script>
  <script>
    window.CC_MAINTENANCE_LIFECYCLE = window.CloudCrowdMaintenance.createLifecycle();
    window.CC_MAINTENANCE_LIFECYCLE.startEnforcement();
  </script>
  <script>
    if (sessionStorage.getItem('cc_auth') !== '1' || !sessionStorage.getItem('cc_token') || !sessionStorage.getItem('cc_role')) {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }
  </script>
  <script src="js/permissions.js"></script>
  <script>
    window.CC_PROTECTED_PAGE_READY = (async () => {
      const access = await window.CCPermissions?.requirePageAccess('daily_complaints', { force: true });
      if (!access || access.unavailable || access.canView !== true) return false;
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'main.js'; script.onload = resolve; script.onerror = reject;
        document.head.appendChild(script);
      });
      return true;
    })();
  </script>
  <script src="js/app-shell.js" defer></script>
  <script src="shared/ticket-domain-config.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/tickets-render.js" defer></script>
  <script src="js/media-viewer.js" defer></script>
  <link rel="stylesheet" href="assets/css/layouts/page-layout.css">
  <link rel="stylesheet" href="assets/css/components/buttons.css">
  <link rel="stylesheet" href="assets/css/components/icons.css">
  <link rel="stylesheet" href="assets/css/components/feedback.css">
  <link rel="stylesheet" href="assets/css/components/forms.css">
  <link rel="stylesheet" href="assets/css/components/filters.css">
  <link rel="stylesheet" href="assets/css/components/cards.css">
  <link rel="stylesheet" href="assets/css/components/status.css">
  <link rel="stylesheet" href="assets/css/components/dialogs.css">
  <link rel="stylesheet" href="assets/css/components/drawers.css">
  <link rel="stylesheet" href="assets/css/components/kanban.css">
  <link rel="stylesheet" href="assets/css/pages/complaints-v2.css">
</head>
<body class="complaints-page complaints-ops-center complaints-v2">
  <div class="complaints-module-shell cc-shell-layout has-responsive-navigation" id="complaints-shell">
    <aside id="complaints-app-sidebar" aria-label="Daily Complaints navigation"></aside>

    <main class="complaints-workspace complaints-main-area cc-page-container cc-page-container--workspace" id="main-content">
      <header id="complaints-app-topbar" role="banner"></header>

      <header class="complaints-hero cc-page-header" aria-labelledby="complaints-page-title">
        <div class="complaints-hero-copy cc-page-header-content">
          <h1 class="cc-page-header-title" id="complaints-page-title">Daily Complaints Operations Center</h1>
          <p class="cc-page-header-description">Track complaint cases, responsible departments, customer impact, and resolution progress.</p>
        </div>
        <div class="complaints-actions cc-page-header-actions">
          <button class="add-ticket-btn" type="button" onclick="openModal('complaints')" data-permission-create>Add New Ticket</button>
        </div>
      </header>

      <section class="complaints-stats cc-metric-grid" aria-label="Daily Complaints summary">
        <article class="complaints-stat-card cc-metric-card complaints-stat-total">
          <span class="complaints-stat-icon" data-cc-icon="clipboard-list" aria-hidden="true"></span>
          <span class="complaints-stat-label">Total Complaints</span>
          <strong id="complaints-stat-total">0</strong>
        </article>
        <article class="complaints-stat-card cc-metric-card complaints-stat-review">
          <span class="complaints-stat-icon" data-cc-icon="history" aria-hidden="true"></span>
          <span class="complaints-stat-label">Under Review</span>
          <strong id="complaints-stat-under-review">0</strong>
        </article>
        <article class="complaints-stat-card cc-metric-card complaints-stat-pending">
          <span class="complaints-stat-icon" data-cc-icon="phone-call" aria-hidden="true"></span>
          <span class="complaints-stat-label">Pending Call Back</span>
          <strong id="complaints-stat-pending">0</strong>
        </article>
        <article class="complaints-stat-card cc-metric-card complaints-stat-escalated">
          <span class="complaints-stat-icon" data-cc-icon="triangle-alert" aria-hidden="true"></span>
          <span class="complaints-stat-label">Escalated</span>
          <strong id="complaints-stat-escalated">0</strong>
        </article>
        <article class="complaints-stat-card cc-metric-card complaints-stat-closed">
          <span class="complaints-stat-icon" data-cc-icon="badge-check" aria-hidden="true"></span>
          <span class="complaints-stat-label">Closed</span>
          <strong id="complaints-stat-closed">0</strong>
        </article>
      </section>

      <section class="complaints-filters cc-filter-bar cc-filter-bar--dense" aria-label="Daily Complaints filters">
        <div class="complaints-filter-field complaints-filter-search">
          <label for="complaints-search">Search</label>
          <input id="complaints-search" type="search" placeholder="Order, case, customer, or phone">
        </div>
        <div class="complaints-filter-field">
          <label for="complaints-status-filter">Status</label>
          <select id="complaints-status-filter">
            <option value="">All statuses</option>
          </select>
        </div>
        <div class="complaints-filter-field">
          <label for="complaints-branch-filter">Branch</label>
          <select id="complaints-branch-filter">
            <option value="">All branches</option>
          </select>
        </div>
        <div class="complaints-filter-field">
          <label for="complaints-restaurant-filter">Restaurant</label>
          <select id="complaints-restaurant-filter">
            <option value="">All restaurants</option>
          </select>
        </div>
        <div class="complaints-filter-field">
          <label for="complaints-issue-filter">Issue Category</label>
          <select id="complaints-issue-filter">
            <option value="">All issues</option>
          </select>
        </div>
      </section>

      <div class="ticket-list complaints-board" id="ticket-list">
        <div id="tickets"></div>
      </div>
    </main>

    <button
      id="complaints-nav-backdrop"
      class="cc-shell-nav-backdrop"
      type="button"
      aria-label="Close Daily Complaints navigation"
      tabindex="-1"
      hidden
    ></button>
  </div>

  <div class="modal cc-dialog" id="modal" aria-hidden="true">
    <div class="modal-content cc-dialog__panel cc-dialog__panel--600" role="dialog" aria-modal="true" aria-labelledby="operations-modal-title" data-cc-overlay-panel>
      <div class="cc-dialog__header"><span class="complaints-modal-icon" data-cc-icon="file-text" aria-hidden="true"></span><h2 class="cc-modal-title cc-dialog__title" id="operations-modal-title">Add New Ticket</h2><button class="drawer-close cc-dialog__close" type="button" aria-label="Close Add New Ticket form" onclick="closeModal()">&times;</button></div>
      <form id="ticket-form" class="cc-form">
        <div id="dynamic-form" class="cc-dialog__body"></div>
        <div class="form-actions cc-form-actions cc-dialog__footer">
          <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="submit-btn">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <div class="drawer cc-drawer" id="ticket-drawer" aria-hidden="true">
    <div class="drawer-backdrop cc-drawer__backdrop"></div>
    <aside class="drawer-panel cc-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title" data-cc-overlay-panel>
      <div class="drawer-header cc-drawer__header">
        <div>
          <div class="drawer-case">Order Number: <span id="drawer-caseNumber"></span></div>
          <h2 class="cc-modal-title" id="drawer-title">Details</h2>
        </div>
        <button class="drawer-close" type="button" onclick="closeTicketDrawer()" aria-label="Close">x</button>
      </div>
      <div class="drawer-meta" id="drawer-meta"></div>
      <div class="drawer-body cc-drawer__body" id="drawer-body"></div>
      <div class="drawer-actions cc-drawer__footer"><button class="edit-btn" id="drawer-edit-btn" type="button">Edit</button></div>
    </aside>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('cc_auth');
      sessionStorage.removeItem('cc_auth');
      localStorage.removeItem('cc_user');
      sessionStorage.removeItem('cc_user');
      localStorage.removeItem('cc_role');
      sessionStorage.removeItem('cc_role');
      localStorage.removeItem('cc_token');
      sessionStorage.removeItem('cc_token');
      window.location.href = 'login.html';
    }

    window.addEventListener('load', async () => {
      if (await window.CC_PROTECTED_PAGE_READY !== true) return;
      await CloudCrowdAppShell.initializeAppShell({
        shell: document.getElementById('complaints-shell'),
        sidebar: document.getElementById('complaints-app-sidebar'),
        topbar: document.getElementById('complaints-app-topbar'),
        backdrop: document.getElementById('complaints-nav-backdrop'),
        activeModule: CloudCrowdAppShell.getModuleById('daily-complaints'),
        fallbackMode: 'legacy',
        brandImage: 'assets/images/logo.png',
        eyebrow: 'Operations Hub',
        title: 'Daily Complaints',
        userId: 'complaints-current-user',
        roleId: 'complaints-current-role',
        onLogout: logout
      });

      currentSection = 'complaints';
      renderTickets();
    });
  </script>
  <script src="idle-logout.js"></script>
</body>
</html>
